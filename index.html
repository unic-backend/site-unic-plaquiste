<script type="application/ld+json">{
 "@context": "https://schema.org",
 "@type": "FAQPage",
 "mainEntity": [
  {
   "@type": "Question",
   "name": "Quel est le prix d'un faux plafond BA13 à Dakar ?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Le prix dépend de la surface, du type de plafond (simple, décoratif, avec spots LED) et de l'état du chantier. Nous établissons un devis gratuit et détaillé après visite ou sur plans. Contactez-nous au 77 708 50 92 pour une estimation rapide."
   }
  },
  {
   "@type": "Question",
   "name": "Intervenez-vous dans tous les quartiers de Dakar ?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Oui. Nous intervenons dans tout Dakar : Almadies, Ouakam, Ngor, Yoff, Plateau, Mermoz, Sacré-Cœur, Point E, Fann, Médina, Parcelles Assainies, ainsi qu'en banlieue (Pikine, Guédiawaye, Rufisque, Diamniadio) et partout au Sénégal sur devis."
   }
  },
  {
   "@type": "Question",
   "name": "Quels sont vos délais pour un chantier de plâtrerie ?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Les délais varient selon l'ampleur des travaux : quelques jours pour un faux plafond de pièce simple, plus pour une rénovation complète. Nous précisons toujours le délai dans le devis et nous nous y tenons."
   }
  },
  {
   "@type": "Question",
   "name": "Le devis est-il vraiment gratuit ?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Oui, le devis est gratuit et sans engagement. Envoyez-nous vos photos ou plans par WhatsApp au 77 708 50 92, ou demandez une visite sur place à Dakar."
   }
  },
  {
   "@type": "Question",
   "name": "Travaillez-vous pour les professionnels (bureaux, commerces, hôtels) ?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Oui. Au-delà des particuliers, nous réalisons les faux plafonds, cloisons, l'isolation et l'aménagement intérieur de bureaux, commerces, boutiques, restaurants, hôtels, écoles, cliniques et bâtiments administratifs ou industriels. Nous collaborons aussi avec les architectes, promoteurs immobiliers et entreprises du bâtiment."
   }
  },
  {
   "@type": "Question",
   "name": "Posez-vous des cloisons et de l'isolation ?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Oui. Nous montons les cloisons sèches et doublages en plaques de plâtre BA13 et posons l'isolation thermique et acoustique (laine de verre) pour améliorer le confort et l'insonorisation de vos pièces."
   }
  }
 ]
}</script>
